<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary -->
  <title>Uruu OS - Business Management Platform for Pharmacies, Retail, Cafés & Print Shops</title>
  <meta name="description" content="Uruu OS is an all-in-one business management platform: point of sale, inventory, pharmacy dispensing, café & WiFi sessions, and printing orders. Start a free 7-day trial." />
  <meta name="theme-color" content="#070B24" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://uruu.enterprises/" />

  <!-- PWA -->
  <meta name="application-name" content="Uruu OS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Uruu OS" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://uruu.enterprises/" />
  <meta property="og:title" content="Uruu OS - Business Management Platform for Pharmacies, Retail, Cafés & Print Shops" />
  <meta property="og:description" content="Point of sale, inventory, pharmacy dispensing, café & WiFi sessions, and printing orders — all in one workspace. Free 7-day trial, no credit card required." />
  <meta property="og:site_name" content="Uruu OS" />
  <meta property="og:image" content="https://uruu.enterprises/icon-512.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Uruu OS - Business Management Platform" />
  <meta name="twitter:description" content="Point of sale, inventory, pharmacy dispensing, café & WiFi sessions, and printing orders — all in one workspace." />
  <meta name="twitter:image" content="https://uruu.enterprises/icon-512.png" />

  <!-- Structured data: lets Google show Uruu OS as a real software product in search results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Uruu OS",
    "url": "https://uruu.enterprises/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "All-in-one business management platform for pharmacies, retail shops, internet cafés, and printing & branding businesses: point of sale, inventory, pharmacy dispensing, café & WiFi sessions, and printing orders.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "ZMW",
      "description": "7-day free trial, no credit card required"
    },
    "provider": {
      "@type": "Organization",
      "name": "Shadow Root Security Technologies",
      "email": "shadowrootsec@gmail.com"
    }
  }
  </script>

  <!-- Favicon — inline SVG data-URI so no asset file is required -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />

  <!-- PWA: installable app manifest + iOS home-screen icon -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Fonts: Inter (body/UI) + Space Grotesk (display), self-hosted (see
       src/index.css @font-face) — no more external fonts.googleapis.com /
       fonts.gstatic.com round trips blocking first paint. -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
